[package]
name = "nixdr"
version = "0.1.0"
edition = "2021"
authors = ["Stefan Hacks <stefan-hacks>"]
description = "Nix error diagnosis and human-readable reporting tool"
license = "MIT"
repository = "https://github.com/stefan-hacks/nixdr"
keywords = ["nix", "nixos", "error", "diagnosis", "cli"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.75"

[dependencies]
# Parsing and regex
regex = "1.10"

# CLI and argument parsing
clap = { version = "4.5", features = ["derive", "color", "env", "wrap_help"] }

# JSON output
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Terminal colors — Catppuccin Mocha theme
owo-colors = "4.0"

# Terminal UI (for repl)
crossterm = "0.28"

# Ordered maps for stable JSON traversal
indexmap = { version = "2.7", features = ["serde"] }

# Detect terminal capabilities (colors, width, TTY)
terminal_size = "0.3"
atty = "0.2"

# Progress spinner and progress bars
indicatif = "0.17"

# HTTP client for fetching known error patterns / LLM suggestions
ureq = { version = "2.9", optional = true }

[features]
default = []
llm = ["ureq"]

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"

[[bin]]
name = "nixdr"
path = "src/main.rs"
